# Security scanning (SEC-CI-1 in ~/Desktop/code/tools/standards/STANDARDS.md): Semgrep, gitleaks,
# npm audit, and dependency review on pull requests in public repos. Copied by claude-new; every action
# is pinned to a commit SHA (Dependabot keeps them current). A Semgrep false positive gets a
# "nosemgrep: <rule-id> -- <reason>" comment; a deliberately fake secret gets "secret-scan:allow" on its
# line (.gitleaks.toml, from standards/templates/gitleaks.toml), a reviewed finding goes in .gitleaksignore.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Semgrep (fails on ERROR findings)
        run: |
          pip install --disable-pip-version-check semgrep==1.185.0
          semgrep scan --config p/default --severity ERROR --error --metrics off

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          f=gitleaks_${VERSION}_linux_x64.tar.gz
          curl -fsSL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/$f"
          echo "$SHA256  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks
          ./gitleaks git --redact --no-banner --log-opts=--all .

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: npm audit (high and critical; only with a package-lock.json)
        if: hashFiles('package-lock.json') != ''
        run: npm audit --audit-level=high

  dependency-review:
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
